<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | 14 July</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8ff;
}

header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:900px;
margin:35px auto;
padding:20px;
}

.welcome{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
text-align:center;
margin-bottom:30px;
}

.welcome h2{
color:#1565c0;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
text-align:center;
text-decoration:none;
color:#222;
box-shadow:0 8px 20px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.icon{
font-size:50px;
margin-bottom:15px;
}

.card h3{
color:#1565c0;
margin-bottom:10px;
}

.card p{
color:#666;
}
</style>

</head>

<body>

<header>
🎂 14 July Dashboard
</header>

<div class="container">

<div class="welcome">
<h2>Welcome 👋</h2>
<p>Let's make someone's birthday unforgettable.</p>
</div>

<div class="grid">

<a class="card" href="profile.html">
<div class="icon">👤</div>
<h3>My Profile</h3>
<p>Edit your profile</p>
</a>

<a class="card" href="birthdays.html">
<div class="icon">🎂</div>
<h3>Today's Birthdays</h3>
<p>See who celebrates today</p>
</a>

<a class="card" href="wishes.html">
<div class="icon">💌</div>
<h3>Send Wish</h3>
<p>Send birthday wishes</p>
</a>

<a class="card" href="inbox.html">
<div class="icon">📥</div>
<h3>Inbox</h3>
<p>Read received wishes</p>
</a>

<a class="card" href="settings.html">
<div class="icon">⚙️</div>
<h3>Settings</h3>
<p>Manage account</p>
</a>

</div>

</div>

</body>
</html>
